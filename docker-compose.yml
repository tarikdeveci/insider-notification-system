x-app: &app
  build: .
  env_file:
    - path: .env
      required: false
  environment: &app-env
    DATABASE_URL: ${DATABASE_URL:-postgres://notif:notif@postgres:5432/notif?sslmode=disable}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: notif
      POSTGRES_PASSWORD: notif
      POSTGRES_DB: notif
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notif -d notif"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *app
    command: ["migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    command: ["api"]
    environment:
      <<: *app-env
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HTTP_ADDR: ":8080"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20

  mock-provider:
    <<: *app
    command: ["mockprovider"]
    environment:
      MOCK_ADDR: ":9090"
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/_control/config"]
      interval: 3s
      timeout: 3s
      retries: 20

  worker:
    <<: *app
    command: ["worker"]
    environment:
      <<: *app-env
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      PROVIDER_URL: ${PROVIDER_URL:-http://mock-provider:9090/}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WORKER_HTTP_ADDR: ":8081"
      WORKER_CONCURRENCY_PER_CHANNEL: ${WORKER_CONCURRENCY_PER_CHANNEL:-10}
      CLAIM_BATCH: ${CLAIM_BATCH:-20}
      RATELIMIT_MAX_WAIT: ${RATELIMIT_MAX_WAIT:-10s}
      RETRY_BASE_DELAY: ${RETRY_BASE_DELAY:-2s}
      RETRY_MAX_DELAY: ${RETRY_MAX_DELAY:-10m}
      MAX_DELIVERY_AGE: ${MAX_DELIVERY_AGE:-24h}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-15s}
      REAPER_INTERVAL: ${REAPER_INTERVAL:-5s}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mock-provider:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
